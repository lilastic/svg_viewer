
events
{

}



http
{
	# specify allowed MIMEs
	types
	{
		text/html html htm;
		text/css css;
		application/javascript js;
		image/svg+xml svg;
		image/png png;
		image/jpeg jpg jpeg;
		image/gif gif;
		text/plain txt;
	}


	# specify default MIME
	default_type text/plain;


	server
	{
	
		# specify port where to serve requests
		listen <listening_port>;


		# serve files
		location /retrieval/ui/viewer/
		{
			rewrite ^/retrieval/ui/viewer/(.*)$ /$1 break;
			root .;
			try_files $uri = 404;
		}


		# proxy requests
		location /retrieval/
		{
			proxy_pass http://<host_name>:<host_port>/retrieval/;

			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		}

	}

}


